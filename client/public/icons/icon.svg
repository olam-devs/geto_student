<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4FE09E"/>
      <stop offset="100%" stop-color="#1AA870"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FD48B"/>
      <stop offset="100%" stop-color="#178F5E"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="96" fill="#0D0F1A"/>

  <!-- Outer glow rings (echo effect) -->
  <circle cx="256" cy="202" r="188" fill="none" stroke="#1FA872" stroke-width="6" opacity="0.35"/>
  <circle cx="256" cy="202" r="168" fill="none" stroke="#1FA872" stroke-width="5" opacity="0.25"/>
  <circle cx="256" cy="202" r="148" fill="none" stroke="#1FA872" stroke-width="4" opacity="0.18"/>

  <!-- Location pin: circle top + tapered sides to point -->
  <path d="M256 460 L138 308 A155 155 0 1 1 374 308 Z" fill="url(#pin)"/>

  <!-- Inner shadow on pin for depth -->
  <path d="M256 430 L158 306 A128 128 0 1 1 354 306 Z" fill="none" stroke="#0D0F1A" stroke-width="1.5" opacity="0.15"/>

  <!-- White bold G inside the pin -->
  <text x="256" y="278"
    text-anchor="middle"
    font-family="'Arial Black','Arial Bold',Impact,Gadget,sans-serif"
    font-weight="900"
    font-size="202"
    fill="white"
    letter-spacing="-4">G</text>
</svg>
